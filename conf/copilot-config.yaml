# GitHub Copilot Models Configuration
# Updated: 2026-06-17
#
# NOTE: As of June 2026, all Claude Opus models (4.6, 4.7, 4.8) natively
# support 1M context (936K prompt). The separate "-1m" model variants have
# been retired. Thinking/reasoning is controlled via request parameters.

# Showing all models (enabled and unconfigured)
litellm_settings:
  drop_params: true

general_settings:
  database_url: postgresql://litellm:litellm@postgres:5432/litellm

model_list:
  # ── Claude Opus 4.8 ────────────────────────────────────────
  - model_name: claude-opus-4.8
    litellm_params:
      model: github_copilot/claude-opus-4.8
      extra_headers: {"copilot-integration-id": "vscode-chat", "x-github-api-version": "2025-05-01", "openai-intent": "conversation-agent"}

